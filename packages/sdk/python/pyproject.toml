[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmark"
version = "0.1.0"
description = "Crowdsourced LLM API performance monitoring"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "platformdirs>=3.0",
    "rich>=12.0",
    "questionary>=2.0",
]
license = { text = "MIT" }
authors = [
  { name = "leaveWhite9088" }
]


[project.scripts]
llmark = "llmark.cli:main"

[project.urls]
Homepage = "https://llmark.top"
Repository = "https://github.com/LLMark/llmark-sdk"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["llmark*"]
